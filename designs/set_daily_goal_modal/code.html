<!-- Header Section -->
<div class="p-8 pb-4 text-center">
<div class="inline-flex items-center justify-center mb-4 bg-secondary/10 px-4 py-1.5 rounded-full">
<span class="material-symbols-outlined text-secondary mr-2" style="font-variation-settings: 'FILL' 1;">local_fire_department</span>
<span class="font-label text-xs uppercase tracking-widest text-secondary font-bold">7 Day Streak</span>
</div>
<h1 class="font-headline text-3xl font-bold text-white tracking-tight">Set Your Daily Mission</h1>
<p class="text-slate-400 mt-2 text-sm">Consistency is the fuel of successful careers.</p>
</div>
<!-- Goal Selector -->
<div class="px-8 py-6">
<div class="flex items-center justify-between bg-surface-container-low rounded-xl p-6 border border-white/5">
<button class="w-12 h-12 rounded-xl flex items-center justify-center bg-surface-variant hover:bg-surface-bright transition-colors active:scale-95 duration-200">
<span class="material-symbols-outlined text-white">remove</span>
</button>
<div class="text-center">
<div class="font-['JetBrains_Mono'] text-6xl font-bold text-primary tracking-tighter">10</div>
<div class="text-[10px] uppercase tracking-widest text-slate-500 font-bold mt-1">Applications</div>
</div>
<button class="w-12 h-12 rounded-xl flex items-center justify-center bg-primary/20 hover:bg-primary/30 transition-colors active:scale-95 duration-200">
<span class="material-symbols-outlined text-primary">add</span>
</button>
</div>
<!-- Simple Slider Indicator (Visual Only) -->
<div class="mt-6 h-1 w-full bg-surface-variant rounded-full overflow-hidden">
<div class="h-full bg-primary w-[40%]"></div>
</div>
</div>
<!-- Platform Breakdown -->
<div class="px-8 py-4">
<h3 class="text-[10px] uppercase tracking-widest text-slate-500 font-bold mb-4">Target Platforms</h3>
<div class="grid grid-cols-3 gap-3">
<div class="flex flex-col items-center justify-center gap-2 p-4 rounded-xl bg-primary/5 border border-primary/20">
<span class="material-symbols-outlined text-primary text-xl">work</span>
<span class="text-[10px] font-bold text-primary uppercase">LinkedIn</span>
</div>
<div class="flex flex-col items-center justify-center gap-2 p-4 rounded-xl bg-surface-container-high border border-white/5 hover:border-white/10 transition-colors">
<span class="material-symbols-outlined text-slate-400 text-xl">business_center</span>
<span class="text-[10px] font-bold text-slate-400 uppercase">Indeed</span>
</div>
<div class="flex flex-col items-center justify-center gap-2 p-4 rounded-xl bg-primary/5 border border-primary/20">
<span class="material-symbols-outlined text-primary text-xl">send</span>
<span class="text-[10px] font-bold text-primary uppercase">Direct</span>
</div>
</div>
</div>

<button class="bg-gold-gradient w-full py-4 rounded-xl font-headline font-bold text-on-secondary shadow-[0_10px_30px_rgba(245,158,11,0.2)] active:scale-95 transition-all duration-200">
