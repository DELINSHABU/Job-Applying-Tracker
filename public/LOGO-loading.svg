<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <style>
      /* Smooth hovering effect for the entire rocket */
      @keyframes hover {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-4px); }
      }
      
      /* Rapid pulsing/flickering effect for the engine flame */
      @keyframes flicker {
        0%, 100% { transform: scaleY(1); opacity: 0.8; }
        50% { transform: scaleY(1.4); opacity: 1; }
      }

      .rocket-ship {
        animation: hover 3s ease-in-out infinite;
      }

      .flame {
        transform-origin: 60px 86px; /* Anchors the scaling to the base of the engine */
        animation: flicker 0.1s ease-in-out infinite alternate;
      }
    </style>

    <linearGradient id="aiPurpleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    
    <filter id="ambientShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#8B5CF6" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="100" height="100" x="10" y="10" rx="24" fill="url(#aiPurpleGradient)" filter="url(#ambientShadow)" />

  <g transform="translate(60, 60) rotate(45) translate(-60, -60)" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    
    <g class="rocket-ship">
      <path d="M 60 30 Q 72 45 72 65 L 72 80 L 48 80 L 48 65 Q 48 45 60 30 Z" />
      
      <circle cx="60" cy="54" r="5.5" />
      
      <path d="M 48 66 L 36 80 L 48 80" />
      
      <path d="M 72 66 L 84 80 L 72 80" />
      
      <path d="M 54 80 L 54 86 L 66 86 L 66 80" />
      
      <path class="flame" d="M 57 86 L 60 94 L 63 86" fill="#FFFFFF" stroke="none" />
    </g>
  </g>
</svg>
